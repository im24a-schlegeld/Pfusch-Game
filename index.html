      /* Keep a useful recovery surface visible if the app bundle or WebGL boot
         fails before React can render its own loading/error screen. React

      #boot-fallback {

        inset: 0;
        box-sizing: border-box;
        height: auto;
        max-height: 100dvh;
        min-height: 0;
        z-index: 2147483647;
        isolation: isolate;
        overflow: hidden;
        display: grid;
        align-content: end;
        justify-items: start;
        gap: 14px;
        padding: calc(env(safe-area-inset-top,0px) + clamp(18px,4dvh,42px)) calc(env(safe-area-inset-right,0px) + clamp(20px,4vw,52px)) calc(env(safe-area-inset-bottom,0px) + clamp(24px,5dvh,50px)) calc(env(safe-area-inset-left,0px) + clamp(20px,4vw,52px));
        background: #232323;
        color: #f4f4f4;
        font: 600 12px/1.4 Arial, Helvetica, sans-serif;
        letter-spacing: .1em;
        text-align: left;
      }
      #boot-fallback picture { position: absolute; inset: 0; z-index: -2; }
      #boot-fallback .boot-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }

      #boot-fallback .boot-caption { width: 100%; max-width: 420px; min-width: 0; }
      #boot-fallback .boot-kicker { display: block; font: 900 clamp(23px,3vw,36px)/1.05 Arial,sans-serif; letter-spacing: -.045em; margin-bottom: 15px; }
      #boot-fallback .boot-track { display: block; margin-top: 14px; height: 3px; background: #ffffff25; overflow: hidden; }
      #boot-fallback .boot-track i { display: block; height: 100%; width: 35%; background: #dedede; animation: boot-slide 1.35s ease-in-out infinite alternate; }
      #boot-fallback .boot-brand { position: absolute; left: calc(env(safe-area-inset-left,0px) + clamp(20px,4vw,52px)); top: calc(env(safe-area-inset-top,0px) + clamp(18px,4dvh,42px)); display: inline-flex; width: 240px; max-width: calc(100% - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)); flex-direction: column; align-items: center; }
      #boot-fallback .boot-brand-signs { position: relative; display: block; width: 100%; aspect-ratio: 2.85; }
      #boot-fallback .boot-brand-signs > img { position: absolute; inset: 0 5% 0 0; width: 95%; max-width: none; height: 100%; object-fit: contain; transform: rotate(6deg); }
      #boot-fallback .boot-brand-stop { position: absolute; width: 6.2%; height: auto; right: 0; bottom: 8%; }
      #boot-fallback .boot-brand-title { display: block; width: 57%; height: auto; margin-top: -6%; object-fit: contain; }
      #boot-fallback .boot-bike {
        flex: none;
        display: block;
        width: 19px;
        height: 19px;
        transform-box: view-box;
        transform-origin: 20.833% 70.833%;
        animation: boot-wheelie 2.8s ease-in-out infinite;
      }
      #boot-fallback button {
        min-height: 42px;
        padding: 10px 16px;
        border: 1px solid #f0f0f0;
        background: #f0f0f0;
        color: #323232;
        font: inherit;
        letter-spacing: .08em;
        cursor: pointer;
      }
      @media(max-aspect-ratio:3/4){#boot-fallback .boot-art{object-position:center}}
      @media(max-width:600px){#boot-fallback{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}#boot-fallback .boot-brand{width:180px}}
      @media(max-height:420px){#boot-fallback{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 15px)}#boot-fallback .boot-brand{top:calc(env(safe-area-inset-top,0px) + 14px);width:180px}#boot-fallback .boot-kicker{display:none}}
      @keyframes boot-wheelie { 0%,18%,100%{transform:rotate(0)}40%,62%{transform:rotate(-24deg)}76%{transform:rotate(-18deg)} }
      @keyframes boot-slide { from{transform:translateX(-35%)}to{transform:translateX(220%)} }
      @media(prefers-reduced-motion:reduce){#boot-fallback .boot-bike,#boot-fallback .boot-track i{animation:none}#boot-fallback .boot-track i{width:100%;opacity:.6}}
