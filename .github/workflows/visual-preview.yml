name: Game visual preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:oxygen
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.offline.config.ts cartoon.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-visual-preview
          path: outputs/browser-pwa
          if-no-files-found: warn
